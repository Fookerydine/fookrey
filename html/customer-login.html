<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login</title>
<link rel="stylesheet" href="css/customer-login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>
<body>
<div class="login-container">
<div class="login-box">

<h1>CUSTOMER LOGIN</h1>
<p> Login</p>

<form id="customerLoginForm">
<div class="form-group">
<label>CustomerID</label>
<input type="text" id="CustomerID" placeholder="Enter CustomerID" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter Password" required>
</div>

<button type="submit" class="login-btn"><i class="fa-solid fa-right-to-bracket"></i>Login</button>

<div class="form-group"></div>

<div class="extra-links">
<p>Forgot Password?<a href="#"> Click Here</a></p>
<p>Don't have an account?<a href="customer-registration.html"> Register Now</a></p>
</div>
</form>
</div>
</div>
<script src="js/customer-login.s"></script>
</body>
</html>
